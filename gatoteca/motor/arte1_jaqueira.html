<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!--ACERVO-->
<style>
:root{--ameixa:#3B2A33;--noite:#2F2229;--creme:#EFE4D0;--ocre:#E3B96A;--ocre2:#E8B84E;--vinho:#A8355D;--salvia:#A2C98C}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;background:var(--ameixa)}
.peca{position:relative;width:1080px;height:1350px;overflow:hidden;color:var(--creme);
  background:radial-gradient(ellipse 70% 52% at 50% 40%,#5A4350 0%,#45333D 42%,#3B2A33 70%,#2C1F26 100%)}
.peca::before,.peca::after{content:"";position:absolute;inset:0;pointer-events:none;background-size:1080px 1440px;z-index:50}
.peca::before{background-image:var(--grao-neg);mix-blend-mode:multiply;opacity:.9}
.peca::after{background-image:var(--grao-pos);mix-blend-mode:plus-lighter;opacity:.75}
.peca>*{position:absolute}
svg{overflow:visible}

/* marca: Entrelinhas escrito entre duas linhas */
.marca{left:0;right:0;top:44px;display:flex;flex-direction:column;align-items:center}
.marca .sobre{font-family:'Cinzel';font-weight:500;font-size:15px;letter-spacing:.42em;margin-right:-.42em;color:var(--ocre);opacity:.95}
.marca .nome{position:relative;margin-top:10px;padding:6px 26px 9px;font-family:'Cormorant';font-style:italic;font-weight:500;font-size:50px;line-height:1;letter-spacing:.01em}
.marca .nome::before,.marca .nome::after{content:"";position:absolute;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--creme) 12%,var(--creme) 88%,transparent);opacity:.75}
.marca .nome::before{top:0}.marca .nome::after{bottom:0}

.carta{left:280px;top:168px;width:520px;height:732px;filter:drop-shadow(0 26px 40px rgba(20,10,16,.55))}

.texto{left:60px;right:60px;top:926px;display:flex;flex-direction:column;align-items:center;text-align:center}
.titulo{font-family:'Cormorant';font-style:italic;font-weight:600;font-size:72px;line-height:1;color:var(--ocre);letter-spacing:-.005em}
.marcada{position:relative;display:inline-block}
.marcada .gi{position:absolute;left:-4%;width:108%;bottom:-20px;height:30px;background:var(--ocre);opacity:.9;
  -webkit-mask:var(--G-ondulado) center/100% 100% no-repeat;mask:var(--G-ondulado) center/100% 100% no-repeat}
.sub{margin-top:30px;font-family:'Cormorant';font-weight:500;font-size:38px;line-height:1.1}
.fio{margin:24px 0 20px;display:flex;align-items:center;gap:16px;color:var(--ocre)}
.fio i{display:block;width:150px;height:1px;background:currentColor;opacity:.6}
.info{display:flex;align-items:center;gap:22px;font-family:'Cinzel';font-weight:600;font-size:22px;letter-spacing:.12em}
.info b{font-weight:700;font-size:30px;color:var(--ocre);letter-spacing:.06em}
.info .losango{width:7px;height:7px;background:var(--ocre);transform:rotate(45deg);opacity:.8}
.inclui{margin-top:22px;font-family:'Cormorant';font-style:italic;font-weight:500;font-size:29px;line-height:1.25;color:rgba(239,228,208,.88);max-width:820px}
.cta{margin-top:20px;font-family:'Cinzel';font-weight:500;font-size:15px;letter-spacing:.3em;margin-right:-.3em;color:var(--ocre)}
</style></head>
